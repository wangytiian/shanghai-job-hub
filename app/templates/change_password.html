{% extends "base.html" %}
{% block title %}修改密码 · 招聘内容运营工作台{% endblock %}
{% block content %}
<section class="page-heading"><span class="eyebrow">SECURITY</span><h1>请修改临时密码</h1><p>首次登录前需要设置仅你本人掌握的新密码。</p></section>
{% if request.query_params.get('feedback') %}<div class="notice notice-error">{{ request.query_params.get('feedback') }}</div>{% endif %}
<section class="panel"><form method="post" action="/account/password" class="form-grid">
<label>新密码<input type="password" name="new_password" minlength="12" required autocomplete="new-password"></label>
<label>确认新密码<input type="password" name="confirm_password" minlength="12" required autocomplete="new-password"></label>
<button class="button button-primary" type="submit">保存并重新登录</button>
</form></section>
{% endblock %}

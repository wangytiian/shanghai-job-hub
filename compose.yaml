name: recruitingops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruiting}
      POSTGRES_USER: ${POSTGRES_USER:-recruiting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-environment
      APP_ENV: cloud
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recruiting}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recruiting}
      SECRET_BACKEND: file
      SECRET_REVISION: ${SECRET_REVISION:-initial}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set https URL in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set domain in .env}
      BAILIAN_SECRET_FILE: /run/secrets/bailian_api_key
      OPENAI_COMPATIBLE_SECRET_FILE: /run/secrets/openai_compatible_api_key
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

    secrets:
      - bailian_api_key
      - openai_compatible_api_key

  web:
    build: .
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
    networks: [internal]
    secrets:
      - bailian_api_key
      - openai_compatible_api_key

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    secrets:
      - bailian_api_key
      - openai_compatible_api_key

  proxy:
    image: caddy:2.8-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set domain in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

secrets:
  bailian_api_key:
    file: ${BAILIAN_SECRET_FILE:?set local secret file path in .env}
  openai_compatible_api_key:
    file: ${OPENAI_COMPATIBLE_SECRET_FILE:?set local secret file path in .env}
